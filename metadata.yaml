name: opencode_session_header
display_name: OpenCode 请求头
short_desc: 为 OpenCode 请求注入 x-opencode-session，并兼容 Anthropic x-api-key 认证，覆盖全部 Go 模型与四类 Provider。
author: sIleNtot
description: 为指向 OpenCode（Zen / Go）端点的 LLM 请求自动注入 x-opencode-session 会话请求头。覆盖 Anthropic Compatible、OpenAI Compatible、OpenAI Responses、Gemini 四类 Provider 及 zen/inference 全部端点；自动补齐 Anthropic x-api-key 认证（兼容 SDK 2.3+ 的 Bearer 行为）；会话 ID 与 OpenCode Desktop 保持一致（ses_ 格式，按 AstrBot 对话稳定推导）。已存在的会话头不会被覆盖，非 OpenCode 端点不受影响。
version: 2.0.0
repo: https://github.com/sIleNtot/opencode_session_header
